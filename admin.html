<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Scanner - Royal Mess</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- HTML5 QR Code Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; overscroll-behavior-y: contain; }
    /* Scanner viewport custom styling */
    #reader { border: none !important; border-radius: 1rem; overflow: hidden; }
    #reader video { object-fit: cover; border-radius: 1rem; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 antialiased min-h-screen flex flex-col">

  <!-- Admin Header -->
  <header class="bg-slate-800 p-4 shadow-md flex justify-between items-center border-b border-slate-700 sticky top-0 z-10">
    <div class="flex items-center gap-3">
      <div class="bg-indigo-500 p-2 rounded-lg">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
      </div>
      <div>
        <h1 class="text-base font-bold text-white leading-tight">Counter Scanner</h1>
        <p class="text-[11px] text-emerald-400 font-semibold tracking-wide uppercase">System Active</p>
      </div>
    </div>
    
    <!-- Kitchen Pause Toggle Button -->
    <button onclick="toggleRefillPause()" id="refillBtn" class="bg-amber-500 hover:bg-amber-400 text-amber-950 px-4 py-2 rounded-xl text-xs font-bold shadow-lg transition-all active:scale-95 flex items-center gap-1.5">
      <span id="refillIcon">⏸️</span> <span id="refillText">Pause Kitchen</span>
    </button>
  </header>

  <main class="max-w-md w-full mx-auto p-4 flex-grow space-y-5">

    <!-- Live Headcount Metrics -->
    <div class="grid grid-cols-3 gap-3 text-center">
      <div class="bg-slate-800 p-3 rounded-2xl border border-slate-700 shadow-sm flex flex-col justify-center">
        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-1">Dine-In</p>
        <p id="countDineIn" class="text-2xl font-black text-indigo-400">0</p>
      </div>
      <div class="bg-slate-800 p-3 rounded-2xl border border-slate-700 shadow-sm flex flex-col justify-center">
        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-1">Tiffin</p>
        <p id="countTiffin" class="text-2xl font-black text-orange-400">0</p>
      </div>
      <div class="bg-slate-800 p-3 rounded-2xl border border-emerald-900/50 shadow-sm flex flex-col justify-center relative overflow-hidden">
        <div class="absolute inset-0 bg-emerald-500/10"></div>
        <p class="text-[10px] text-emerald-400 font-bold uppercase tracking-wider mb-1 relative z-10">Total</p>
        <p id="countTotal" class="text-2xl font-black text-emerald-400 relative z-10">0</p>
      </div>
    </div>

    <!-- QR Camera Scanner Box -->
    <div class="bg-slate-800 p-2 rounded-2xl border border-slate-700 shadow-2xl relative">
      <div class="absolute -top-3 left-1/2 transform -translate-x-1/2 bg-indigo-600 text-white text-[10px] font-bold px-3 py-1 rounded-full shadow-md z-10">
        SCAN STUDENT QR
      </div>
      <!-- Scanner container -->
      <div id="reader" class="w-full bg-black min-h-[300px] flex items-center justify-center">
        <!-- Will be replaced by camera stream -->
        <div class="text-slate-500 text-sm flex items-center gap-2">
           <svg class="animate-spin h-5 w-5 text-slate-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
           Starting Camera...
        </div>
      </div>
    </div>

    <!-- Action Action Sheet / Modal (Hidden by default) -->
    <!-- Ye tab open hoga jab QR scan ho jayega -->
    <div id="scanResultModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 hidden flex flex-col justify-end transition-opacity duration-300 opacity-0">
      
      <!-- Modal Card (Slides up from bottom) -->
      <div id="modalCard" class="bg-white w-full rounded-t-3xl p-6 pb-10 shadow-2xl transform translate-y-full transition-transform duration-300">
        
        <!-- Drag Handle Indicator -->
        <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-6"></div>

        <div class="flex items-center gap-4 mb-6">
          <!-- Student Photo -->
          <div class="w-20 h-20 rounded-2xl overflow-hidden border-4 border-gray-100 shadow-sm shrink-0">
            <img id="scannedPhoto" src="https://ui-avatars.com/api/?name=Loading" class="w-full h-full object-cover">
          </div>
          
          <!-- Student Details -->
          <div class="flex-grow">
            <h3 id="scannedName" class="text-xl font-black text-gray-900 leading-tight">--</h3>
            <p id="scannedPhone" class="text-sm text-gray-500 font-medium mb-2">--</p>
            <div id="scannedStatus" class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-[11px] font-black uppercase tracking-wide">
              <!-- JS will inject classes: bg-green-100 text-green-700 for PAID, bg-red-600 text-white for UNPAID -->
              Checking...
            </div>
          </div>
        </div>

        <!-- Action Buttons for Staff (Big targets for fast tapping) -->
        <div class="grid grid-cols-2 gap-3 mb-4">
          <button onclick="confirmAttendance('DINE_IN')" class="py-4 bg-indigo-50 hover:bg-indigo-100 border-2 border-indigo-200 hover:border-indigo-500 text-indigo-700 font-black text-base rounded-2xl shadow-sm transition-all active:scale-95 flex flex-col items-center gap-1">
            <span class="text-2xl">🍽️</span> Dine-In
          </button>
          <button onclick="confirmAttendance('TIFFIN')" class="py-4 bg-orange-50 hover:bg-orange-100 border-2 border-orange-200 hover:border-orange-500 text-orange-700 font-black text-base rounded-2xl shadow-sm transition-all active:scale-95 flex flex-col items-center gap-1">
            <span class="text-2xl">📦</span> Tiffin
          </button>
        </div>
        
        <!-- Cancel Button -->
        <button onclick="closeModal()" class="w-full py-3 bg-gray-100 text-gray-600 hover:bg-gray-200 font-bold rounded-xl transition-all active:scale-95">
          Cancel / Close
        </button>
      </div>
    </div>

  </main>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  
  <script src="firebase.js"></script>
  <script src="admin.js"></script>
</body>
</html>
