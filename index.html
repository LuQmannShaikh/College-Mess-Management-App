<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Student Mess Pass</title>
  
  <!-- PWA Manifest for Add to Home Screen -->
  <link rel="manifest" href="manifest.json">
  
  <!-- Tailwind CSS for Modern UI -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- QR Code Generator Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">

  <!-- Inter Font for Professional Look -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    /* Prevent pull-to-refresh on mobile */
    body { overscroll-behavior-y: contain; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased min-h-screen pb-10 flex flex-col">

  <!-- Top Header Banner -->
  <header class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white p-5 text-center shadow-lg rounded-b-3xl mb-4 relative z-10">
    <h1 class="text-2xl font-extrabold tracking-tight">Royal Mess</h1>
    <p class="text-sm text-blue-100 font-medium mt-1 opacity-90">Daily Digital Pass</p>
  </header>

  <!-- Main Content Container -->
  <main class="max-w-md w-full mx-auto px-4 flex-grow space-y-5 -mt-4 relative z-20">

    <!-- Kitchen Alert Notification (Hidden by default, controlled via JS) -->
    <div id="kitchenAlert" class="hidden bg-red-500 text-white p-4 rounded-2xl shadow-xl text-center text-sm font-bold flex items-center justify-center gap-2 animate-bounce">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
      <span>Kitchen Refill Pause (15 Mins). Kripya wait karein!</span>
    </div>

    <!-- Student Profile & Dynamic QR Card -->
    <div class="bg-white rounded-3xl shadow-xl p-6 text-center space-y-5 border border-gray-100 transform transition-all duration-300 hover:shadow-2xl">
      
      <!-- Profile Header -->
      <div class="flex items-center justify-center gap-4">
        <div class="relative w-16 h-16">
          <!-- Placeholder photo, will be updated via JS -->
          <img id="userPhoto" src="https://ui-avatars.com/api/?name=Student&background=random&size=150" alt="Student" class="w-full h-full rounded-full object-cover border-4 border-indigo-100 shadow-sm">
          <span id="statusBadge" class="absolute -bottom-1 -right-2 bg-green-500 text-white text-[10px] px-2.5 py-1 rounded-full font-bold uppercase tracking-wider shadow-md border-2 border-white">PAID</span>
        </div>
        <div class="text-left">
          <h2 id="userName" class="text-xl font-bold text-gray-900 leading-tight">Loading...</h2>
          <p id="userPhone" class="text-sm text-gray-500 font-medium">Fetching details</p>
        </div>
      </div>

      <!-- Divider -->
      <hr class="border-gray-100">

      <!-- The Core Feature: QR Code Display -->
      <div>
        <h3 class="text-sm font-semibold text-gray-600 mb-3">Aaj ka aapka QR Pass</h3>
        <div class="bg-gray-50 p-4 rounded-2xl border-2 border-dashed border-indigo-200 inline-block mx-auto relative group">
          <!-- QR Code Canvas goes here -->
          <div id="qrcode" class="flex justify-center transition-transform duration-300 group-hover:scale-105"></div>
          
          <!-- Loading overlay for QR -->
          <div id="qrLoading" class="absolute inset-0 bg-gray-50/80 flex items-center justify-center rounded-xl">
             <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
          </div>
        </div>
        <p class="text-xs text-gray-400 mt-3 font-medium flex items-center justify-center gap-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          Counter par scanner ke aage dikhayein
        </p>
      </div>
    </div>

    <!-- Interactive Meal Preference Selector -->
    <div class="bg-white rounded-3xl shadow-lg p-5 space-y-4 border border-gray-100">
      <h3 class="text-[15px] font-bold text-gray-800 border-b border-gray-100 pb-2">Aaj ka Meal Plan</h3>
      
      <!-- Quick Action Buttons -->
      <div class="grid grid-cols-2 gap-3">
        <!-- Dine In Button -->
        <button onclick="setMealMode('DINE_IN')" id="btnDineIn" class="group relative overflow-hidden p-4 rounded-2xl bg-indigo-50 border-2 border-transparent hover:border-indigo-600 transition-all duration-200 active:scale-95 flex flex-col items-center gap-2">
          <span class="text-2xl group-hover:scale-110 transition-transform">🍽️</span>
          <span class="font-bold text-sm text-indigo-900">Dine-In</span>
          <span class="text-[10px] text-indigo-500 font-medium">Yahi khaunga</span>
        </button>
        
        <!-- Tiffin Button -->
        <button onclick="setMealMode('TIFFIN')" id="btnTiffin" class="group relative overflow-hidden p-4 rounded-2xl bg-orange-50 border-2 border-transparent hover:border-orange-500 transition-all duration-200 active:scale-95 flex flex-col items-center gap-2">
          <span class="text-2xl group-hover:scale-110 transition-transform">📦</span>
          <span class="font-bold text-sm text-orange-900">Tiffin</span>
          <span class="text-[10px] text-orange-500 font-medium">Pack karwaunga</span>
        </button>
      </div>

      <!-- Money Saving / Leave Feature -->
      <button onclick="toggleSkipMeal()" id="btnSkip" class="w-full py-3.5 mt-2 bg-gray-50 hover:bg-red-50 text-gray-600 hover:text-red-600 border border-gray-200 hover:border-red-200 text-sm font-bold rounded-2xl transition-all duration-200 flex items-center justify-center gap-2 group active:scale-95">
        <span class="group-hover:-translate-y-1 transition-transform">✈️</span> 
        Bahar jaa raha hu (Skip Meal)
      </button>
    </div>

    <!-- Status Message Area (For Toast Notifications) -->
    <div id="toastMessage" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full text-sm font-semibold shadow-2xl opacity-0 pointer-events-none transition-opacity duration-300 flex items-center gap-2 z-50">
      <span id="toastIcon">✅</span>
      <span id="toastText">Action Successful</span>
    </div>

  </main>

  <!-- Scripts -->
  <!-- Firebase Core App (Compat version for easier setup initially) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <!-- Firebase Firestore (Database) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  
  <!-- Our Custom Logic -->
  <script src="firebase.js"></script>
  <script src="app.js"></script>
</body>
</html>
