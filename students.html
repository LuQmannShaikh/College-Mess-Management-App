<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Manage Students - Royal Mess</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 antialiased min-h-screen pb-20">

  <!-- Header -->
  <header class="bg-slate-800 p-4 shadow-md flex justify-between items-center border-b border-slate-700 sticky top-0 z-10">
    <div>
      <h1 class="text-lg font-bold text-white">Owner Dashboard</h1>
      <p class="text-[11px] text-emerald-400 font-semibold tracking-wide uppercase">Fee & Student Manager</p>
    </div>
    <a href="admin.html" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition-all">
      Go to Scanner
    </a>
  </header>

  <main class="max-w-md w-full mx-auto p-4 space-y-6">

    <!-- Add New Student Form -->
    <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-xl">
      <h2 class="text-sm font-black text-white uppercase tracking-wider mb-4 border-b border-slate-700 pb-2">➕ Add New Student</h2>
      
      <form id="addStudentForm" class="space-y-3">
        <div>
          <label class="text-xs text-slate-400 font-bold">Student Name</label>
          <input type="text" id="sName" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none mt-1">
        </div>
        <div>
          <label class="text-xs text-slate-400 font-bold">Mobile Number (Yehi inka ID hoga)</label>
          <input type="number" id="sPhone" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none mt-1">
        </div>
        
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs text-slate-400 font-bold">Total Fees (₹)</label>
            <input type="number" id="sTotalFee" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none mt-1">
          </div>
          <div>
            <label class="text-xs text-slate-400 font-bold">Paid Amount (₹)</label>
            <input type="number" id="sPaidAmount" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none mt-1">
          </div>
        </div>

        <button type="submit" class="w-full mt-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg transition-all active:scale-95">
          Save Student
        </button>
      </form>
    </div>

    <!-- Student List Section -->
    <div>
      <h2 class="text-sm font-black text-white uppercase tracking-wider mb-3">📋 All Students Record</h2>
      <div id="studentList" class="space-y-3">
        <!-- JS will inject student cards here -->
        <p class="text-slate-400 text-sm text-center py-4">Loading students...</p>
      </div>
    </div>

  </main>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="firebase.js"></script>
  <script src="students.js"></script>
</body>
</html>
